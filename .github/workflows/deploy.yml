name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}

      - run: npm ci
        working-directory: ./text

      - run: npm run build
        working-directory: ./text
        env:
          VITE_BASE_URL: /wordoverlap/text/

      - run: npm ci
        working-directory: ./sav

      - run: npm run build
        working-directory: ./sav
        env:
          VITE_BASE_URL: /wordoverlap/savcsv/

      - run: |
          mkdir -p dist/text dist/savcsv
          cp -R text/dist/. dist/text/
          cp -R sav/dist/. dist/savcsv/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - uses: actions/deploy-pages@v4
